services:
  - type: web
    name: consertai
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: equipe
      - key: ADMIN_PASSWORD
        sync: false
