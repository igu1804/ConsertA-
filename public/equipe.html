<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso da equipe · ConsertAí</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fbf9f5;color:#104456;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{width:min(100%,460px);background:#fff;border:1px solid #dde6df;border-radius:24px;padding:32px;box-shadow:0 16px 50px #1044560c}.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{color:#c98a3c}h1{font-size:27px;margin-bottom:8px}p{color:#586b70}label{display:block;font-weight:650;margin:16px 0 6px}input{font:inherit;width:100%;padding:13px;border:1px solid #becfcf;border-radius:9px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:13px 17px}#submit{background:#104456;color:#fff;width:100%;font-weight:700;margin-top:22px}.secondary{background:#f0f2ed;color:#104456;width:100%;margin-top:10px}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e9b977;outline-offset:3px}#status{min-height:24px;margin:18px 0;color:#104456}a{color:#104456}small{display:block;color:#586b70;margin-top:18px}[hidden]{display:none!important}#verification{margin-top:20px;padding-top:12px;border-top:1px solid #dde6df}</style></head>
<body><main><div class="brand">Consert<span>Aí.</span></div><h1>Acesso da equipe</h1><p>Acompanhe os interesses e os cadastros do piloto.</p>
<form><div id="name-field" hidden><label for="fullname">Seu nome</label><input id="fullname" name="fullname" autocomplete="name" maxlength="100"></div><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="username" maxlength="160"><label for="password">Senha</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"><button id="submit">Entrar no painel</button></form>
<button class="secondary" id="register" type="button">Primeiro acesso? Criar conta</button><button class="secondary" id="resend" type="button">Verificar meu e-mail</button>
<section id="verification" hidden><label for="otp">Código recebido por e-mail</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10"><button id="verify" class="secondary" type="button">Confirmar código</button></section>
<p id="status" role="status" aria-live="polite"></p><a href="/consertai">← Voltar ao site</a><button id="logout" class="secondary" type="button">Sair da conta</button><small>O painel é restrito às contas autorizadas pelo responsável da equipe.</small></main><script src="/assets/team.js" type="module"></script></body></html>
